<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060a">
  <meta name="format-detection" content="telephone=no">
  <title>Die verschlossene Tür</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-scene="loading">
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <!-- Laden -->
    <section id="screen-loading" class="screen screen-center">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">Die Schatten regen sich …</p>
    </section>

    <!-- Raum -->
    <section id="screen-room" class="screen" hidden>
      <header class="room-head">
        <p class="eyebrow" id="room-eyebrow"></p>
        <h1 id="room-title"></h1>
        <p class="lead" id="room-text"></p>
      </header>

      <form id="code-form" class="code-form" autocomplete="off" novalidate>
        <div class="code-inputs" role="group" aria-label="Sechsstelliger Code">
          <input type="text" inputmode="text" aria-label="Zeichen 1 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <input type="text" inputmode="text" aria-label="Zeichen 2 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <input type="text" inputmode="text" aria-label="Zeichen 3 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <input type="text" inputmode="text" aria-label="Zeichen 4 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <input type="text" inputmode="text" aria-label="Zeichen 5 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <input type="text" inputmode="text" aria-label="Zeichen 6 von 6" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        </div>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
        <button type="submit" id="open-btn" class="btn" disabled>
          <span class="btn-label">Öffnen</span>
          <span class="spinner spinner-small" aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <!-- Gesperrt -->
    <section id="screen-locked" class="screen screen-center" hidden>
      <svg class="keyhole" viewBox="0 0 40 64" aria-hidden="true">
        <circle cx="20" cy="18" r="13"/>
        <path d="M13 26 L7 60 H33 L27 26 Z"/>
      </svg>
      <p class="locked-text">Die Tür hat sich verriegelt. Ein Fehler nur – und du bleibst.</p>
    </section>

    <!-- Geschafft -->
    <section id="screen-end" class="screen screen-center" hidden>
      <p class="eyebrow">Frei</p>
      <h1>Du bist entkommen</h1>
      <p class="lead">Die letzte Tür schwingt auf. Kühle Nachtluft – und hinter dir fällt das Schloss ins Leere.</p>
    </section>

    <!-- Verbindungsfehler -->
    <section id="screen-error" class="screen screen-center" hidden>
      <h1 class="h-small">Keine Verbindung</h1>
      <p class="lead" id="error-text"></p>
      <button type="button" id="retry-btn" class="btn btn-ghost">Erneut versuchen</button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
